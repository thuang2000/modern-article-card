<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A responsive article card demonstrating modern CSS features including OKLCH colors, fluid typography, CSS custom properties, dark mode, and optical text trimming."
    >

    <title>Modern CSS Article Card</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <a class="site-logo" href="#main-content">
            Modern Web
        </a>

        <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-pressed="false"
            aria-label="Switch to dark mode"
        >
            <span class="theme-toggle__icon" aria-hidden="true">
                ☾
            </span>

            <span class="theme-toggle__text">
                Dark mode
            </span>
        </button>
    </header>

    <main class="page" id="main-content">
        <article class="article-card">
            <div class="article-card__image-container">
                <img
                    class="article-card__image"
                    src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1200&q=80"
                    alt="Laptop displaying programming code on a desk"
                    width="1200"
                    height="800"
                >
            </div>

            <div class="article-card__content">
                <p class="article-card__badge">
                    Web Development
                </p>

                <h1 class="article-card__title">
                    Building More Accessible Websites with Modern CSS
                </h1>

                <p class="article-card__description">
                    Learn how perceptual colors, fluid typography, semantic
                    HTML, and thoughtful responsive design can create a better
                    experience for every visitor.
                </p>

                <a
                    class="article-card__button"
                    href="https://developer.mozilla.org/en-US/docs/Web/CSS"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Read the article about building accessible websites with modern CSS"
                >
                    Read Article

                    <span
                        class="article-card__button-icon"
                        aria-hidden="true"
                    >
                        →
                    </span>
                </a>
            </div>
        </article>
    </main>

    <footer class="site-footer">
        <p>
            Created as a modern CSS verification project.
        </p>
    </footer>
</body>
</html>
